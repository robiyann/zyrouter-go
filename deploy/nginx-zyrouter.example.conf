# Production topology:
#   panel.zyvenox.tech  -> admin UI
#   client.zyvenox.tech -> standalone client portal + user control API
#   api.zyvenox.tech    -> inference gateway (/v1)
# Replace the static root and certificate paths for the VPS.

upstream zyrouter_backend { server 127.0.0.1:20128; }

server {
    listen 443 ssl http2;
    server_name panel.zyvenox.tech;
    # ssl_certificate ...;
    # ssl_certificate_key ...;

    location / {
        proxy_pass http://zyrouter_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

server {
    listen 443 ssl http2;
    server_name client.zyvenox.tech;
    root /root/zyrouter-client;
    # ssl_certificate ...;
    # ssl_certificate_key ...;

    # Do not expose admin/control-plane routes through the client hostname.
    location ~ ^/api/(auth|keys|providers|combos|settings|proxy-pools|model-aliases|custom-models|models|provider-nodes|provider-prefixes|oauth|admin)(/|$) { return 404; }
    location ~ ^/(admin|usage|translator|debug)(/|$) { return 404; }

    location /api/ {
        proxy_pass http://zyrouter_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}

server {
    listen 443 ssl http2;
    server_name api.zyvenox.tech;
    # ssl_certificate ...;
    # ssl_certificate_key ...;

    location /v1/ {
        proxy_pass http://zyrouter_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /models {
        proxy_pass http://zyrouter_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /health {
        proxy_pass http://zyrouter_backend;
        proxy_set_header Host $host;
    }

    location / { return 404; }
}
