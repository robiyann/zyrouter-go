name = "zyrouter-verification-gateway"
main = "src/index.js"
compatibility_date = "2026-09-08"

routes = [
  { pattern = "client.zyvenox.tech/api/user/verification/*", zone_name = "zyvenox.tech" },
  { pattern = "client.zyvenox.tech/api/telegram/webhook", zone_name = "zyvenox.tech" }
]

[vars]
ORIGIN_BASE = "https://origin-api.zyvenox.tech"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]
